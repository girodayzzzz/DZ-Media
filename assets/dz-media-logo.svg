<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">DZ Media logo</title>
  <desc id="logoDesc">Gradient monogram DZ with DZ Media wordmark.</desc>
  <defs>
    <linearGradient id="dzGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8dc2ff"/>
      <stop offset="100%" stop-color="#4f7bff"/>
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6f8ff"/>
      <stop offset="100%" stop-color="#cddcff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#4f7bff" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect x="14" y="14" width="152" height="152" rx="34" fill="#0e162a" stroke="rgba(141,194,255,0.45)" stroke-width="2"/>
  <path d="M44 52h70c16 0 28 12 28 28s-12 28-28 28H72v20h42" fill="none" stroke="url(#dzGradient)" stroke-linecap="round" stroke-linejoin="round" stroke-width="16" filter="url(#glow)"/>
  <path d="M58 128h84" stroke="url(#dzGradient)" stroke-width="16" stroke-linecap="round"/>

  <text x="194" y="95" font-size="64" font-weight="700" letter-spacing="1.8" font-family="Inter,Segoe UI,Roboto,Arial,sans-serif" fill="url(#textGradient)">DZ</text>
  <text x="194" y="138" font-size="34" font-weight="500" letter-spacing="8.6" font-family="Inter,Segoe UI,Roboto,Arial,sans-serif" fill="#9fb6e6">MEDIA</text>
</svg>
