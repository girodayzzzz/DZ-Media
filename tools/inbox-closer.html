<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inbox Closer | DZ Media Tools</title>
  <meta name="description" content="Turn client messages into deal-closing replies instantly with DZ Media's Inbox Closer tool.">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="bg-effects" aria-hidden="true">
    <span class="orb orb-1"></span>
    <span class="orb orb-2"></span>
    <span class="grid"></span>
  </div>

  <main id="main" class="is-visible">
    <nav class="site-nav" aria-label="Primary navigation">
      <a class="brand" href="../index.html"><img src="../assets/dz-media-logo.png" alt="DZ Media logo"></a>
      <div class="nav-links">
        <a href="../index.html">Home</a>
        <a href="../services.html">Services</a>
        <a href="../portfolio.html">Portfolio</a>
        <a href="../about.html">About</a>
        <a href="../contact.html">Contact</a>
        <a href="inbox-closer.html">Tools</a>
        <a aria-current="page" href="inbox-closer.html">Inbox Closer</a>
      </div>
    </nav>

    <header class="hero tools-hero">
      <p class="badge">Tools</p>
      <h1>Inbox Closer</h1>
      <p class="hero-copy">Turn client messages into deal-closing replies instantly.</p>
    </header>

    <section class="section tools-shell" aria-label="Inbox Closer tool">
      <div class="tools-card">
        <form id="inbox-closer-form" class="booking-form" novalidate>
          <label for="client-message">Paste client message
            <textarea id="client-message" name="client-message" rows="5" placeholder="e.g. Hi, how much for your service?" required></textarea>
          </label>

          <label for="reply-goal">Goal
            <select id="reply-goal" name="reply-goal" required>
              <option value="Close the deal">Close the deal</option>
              <option value="Send price">Send price</option>
              <option value="Book a call">Book a call</option>
              <option value="Follow up">Follow up</option>
            </select>
          </label>

          <button class="main-cta" type="submit">Generate Reply</button>
        </form>

        <section id="generated-output" class="tool-output" aria-live="polite" hidden>
          <p class="kicker">Your Reply:</p>
          <textarea id="reply-text" rows="6" readonly></textarea>
          <button id="copy-reply" class="secondary-cta" type="button">Copy</button>
          <p id="copy-status" class="helper-text"></p>
        </section>
      </div>
    </section>
  </main>

  <script src="../script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("inbox-closer-form");
      const goalField = document.getElementById("reply-goal");
      const outputSection = document.getElementById("generated-output");
      const replyText = document.getElementById("reply-text");
      const copyButton = document.getElementById("copy-reply");
      const copyStatus = document.getElementById("copy-status");

      const repliesByGoal = {
        "Close the deal": "Hi! Thanks for reaching out. I'd love to help you with this. Based on what you're looking for, I can offer a solution that delivers great results. Let me know if you'd like to get started or discuss further.",
        "Send price": "Hi! Thanks for your message. Pricing typically depends on your needs, but it usually starts from €150–€300. I'd be happy to give you a more precise quote — could you share a bit more detail?",
        "Book a call": "Hi! Thanks for reaching out. It would be great to discuss your needs in more detail. Are you available for a quick call this week?",
        "Follow up": "Hi! Just checking in regarding my previous message. Let me know if you're still interested — I'd be happy to help."
      };

      if (!form || !goalField || !outputSection || !replyText || !copyButton || !copyStatus) return;

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const selectedGoal = goalField.value;
        const generatedReply = repliesByGoal[selectedGoal] || repliesByGoal["Close the deal"];

        replyText.value = generatedReply;
        outputSection.hidden = false;
        copyStatus.textContent = "";
      });

      copyButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(replyText.value);
          copyStatus.textContent = "Reply copied.";
          copyStatus.classList.remove("is-error");
        } catch (error) {
          copyStatus.textContent = "Copy failed. Please copy manually.";
          copyStatus.classList.add("is-error");
        }
      });
    });
  </script>
</body>
</html>
